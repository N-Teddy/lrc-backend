databases:
  - name: lrc-postgres
    region: oregon
    plan: starter
    databaseName: lrc_db

services:
  - type: web
    name: auth-service
    region: oregon
    plan: starter
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:auth
    startCommand: npm run start:auth
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_HOST
        fromDatabase:
          name: lrc-postgres
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: lrc-postgres
          property: port
      - key: DATABASE_USER
        fromDatabase:
          name: lrc-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: lrc-postgres
          property: password
      - key: DATABASE_NAME
        fromDatabase:
          name: lrc-postgres
          property: database
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_AT
        value: "3600"
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRE_AT
        value: "86400"
      - key: JWT_RESET_SECRET
        sync: false
      - key: JWT_RESET_EXPIRE_AT
        value: "3600"

  - type: web
    name: admin-service
    region: oregon
    plan: starter
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:admin
    startCommand: npm run start:admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PORT
        value: "3003"
      - key: DATABASE_HOST
        fromDatabase:
          name: lrc-postgres
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: lrc-postgres
          property: port
      - key: DATABASE_USER
        fromDatabase:
          name: lrc-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: lrc-postgres
          property: password
      - key: DATABASE_NAME
        fromDatabase:
          name: lrc-postgres
          property: database
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_AT
        value: "3600"

  - type: web
    name: jrs-service
    region: oregon
    plan: starter
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:jrs
    startCommand: npm run start:jrs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3004"
      - key: DATABASE_HOST
        fromDatabase:
          name: lrc-postgres
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: lrc-postgres
          property: port
      - key: DATABASE_USER
        fromDatabase:
          name: lrc-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: lrc-postgres
          property: password
      - key: DATABASE_NAME
        fromDatabase:
          name: lrc-postgres
          property: database
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_AT
        value: "3600"